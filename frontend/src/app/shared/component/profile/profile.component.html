<div class="profile-container">
  <!-- Profile Header -->
  <div class="profile-header">
    <div class="profile-avatar">
      <svg class="avatar-img" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm246-164q-59 0-99.5-40.5T340-580q0-59 40.5-99.5T480-720q59 0 99.5 40.5T620-580q0 59-40.5 99.5T480-440Zm0 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q53 0 100-15.5t86-44.5q-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160Zm0-360q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm0-60Zm0 360Z"/></svg>
      <!-- <img src="" alt="User Avatar" class="avatar-img"> -->
    </div>
    <div class="profile-info">
      <h1 class="profile-name">{{ user.name }}</h1>
      <p class="profile-role">{{ user.role }}</p>
      <p class="profile-email">{{ user.email }}</p>
    </div>
    <div class="profile-actions">
      <button *ngIf="!isEditMode" class="btn-edit" (click)="toggleEditMode()">
        <i class="fas fa-edit"></i> Edit Profile
      </button>
      <button *ngIf="isEditMode" class="btn-save" (click)="saveProfile()">
        <i class="fas fa-save"></i> Save
      </button>
      <button *ngIf="isEditMode" class="btn-cancel" (click)="cancelEdit()">
        <i class="fas fa-times"></i> Cancel
      </button>
     
      <button class="btn-logout" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>

      <button class="btn-back flex items-center gap-2 px-4 py-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition duration-200 font-medium" [routerLink]="['/intern-list']">
        <i class="fas fa-arrow-left"></i> Back to List
      </button>
    </div>
  </div>

  <!-- Profile Details -->
  <div class="profile-details">
    <div class="detail-section">
      <h2>Personal Information</h2>
      <div class="detail-group">
        <label>Full Name</label>
        <input 
          *ngIf="isEditMode" 
          type="text" 
          class="input-field" 
          [(ngModel)]="user.name"
        >
        <p *ngIf="!isEditMode" class="detail-value">{{ user.name }}</p>
      </div>
      <div class="detail-group">
        <label>Email</label>
        <input 
          *ngIf="isEditMode" 
          type="email" 
          class="input-field" 
          [(ngModel)]="user.email"
        >
        <p *ngIf="!isEditMode" class="detail-value">{{ user.email }}</p>
      </div>
      <div class="detail-group">
        <label>Role</label>
        <input 
          *ngIf="isEditMode" 
          type="text" 
          class="input-field" 
          [(ngModel)]="user.role"
        >
        <p *ngIf="!isEditMode" class="detail-value">{{ user.role }}</p>
      </div>
      <div class="detail-group">
        <label>username</label>
        <input 
          *ngIf="isEditMode" 
          type="text" 
          class="input-field" 
          [(ngModel)]="user.username"
        >
        <p *ngIf="!isEditMode" class="detail-value">{{ user.username }}</p>
      </div>
      <div class="detail-group">
        <label>Password</label>
        <input 
          *ngIf="isEditMode" 
          type="password" 
          class="input-field" 
          [(ngModel)]="user.password"
          placeholder="Enter new Password"
        >
        <!-- <p *ngIf="!isEditMode" class="detail-value">{{ user.password }}</p> -->
      </div>
    
  </div>
   
</div>

<div class="min-h-screen w-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-600 flex items-center justify-center p-4">
  <div class="w-screen max-w-md">
    <!-- Card Container -->
    <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden border border-white/20">
      
      <!-- Header Section -->
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-8 text-center">
        <h1 class="text-3xl font-bold text-white mb-1">Welcome Back</h1>
        <p class="text-indigo-100 text-xs">Intern Management System</p>
      </div>

      <!-- Form Section -->
      <div class="px-8 py-8">
        <form [formGroup]="login" (ngSubmit)="loginUser()" class="space-y-4">
          
          <!-- Username Field -->
          <div>
            <label for="username" class="block text-sm font-semibold text-gray-800 mb-2">Username</label>
            <div class="relative">
              <input 
                formControlName="username" 
                id="username" 
                type="text" 
                placeholder="Enter your username" 
                class="w-full px-4 py-2.5 rounded-lg bg-gray-50 border-2 border-gray-200 text-gray-900 placeholder:text-gray-500 focus:border-indigo-500 focus:bg-white focus:outline-none transition duration-200"
              />
              <svg class="absolute right-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-sm font-semibold text-gray-800 mb-2">Password</label>
            <div class="relative">
              <input 
                formControlName="password" 
                id="password" 
                type="password" 
                placeholder="Enter your password" 
                class="w-full px-4 py-2.5 rounded-lg bg-gray-50 border-2 border-gray-200 text-gray-900 placeholder:text-gray-500 focus:border-indigo-500 focus:bg-white focus:outline-none transition duration-200"
              />
              <svg class="absolute right-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
          </div>

          <!-- Login Button -->
          <button 
            type="submit" 
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-300 transform hover:scale-105 active:scale-95 shadow-lg hover:shadow-xl mt-6"
          >
            Sign In
          </button>
        </form> 

        <!-- Footer Text -->
        <p class="text-center text-xs text-gray-600 mt-6">
          Don't have an account? 
          <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-700 transition">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
